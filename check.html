<!doctype html>
<html lang="en" class="kiosk-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fbfaf7">
<title>packOS kiosk · device check</title>
<link rel="icon" href="packos-logo.png">
<link rel="stylesheet" href="kiosk.css">
<link rel="stylesheet" href="check.css">
<script src="kiosk-data.js"></script>
<script src="qr.js"></script>
<script src="check.js" defer></script>
</head>
<body class="kiosk kiosk-check">
<main class="kiosk-check-page" id="check">
  <header class="kiosk-head">
    <img class="kiosk-logo" src="packos-logo.png" alt="packOS" width="144" height="32" draggable="false">
    <a class="kiosk-back" href="index.html">Back to kiosk</a>
  </header>
  <h1 class="kiosk-title">Device check</h1>
  <p class="kiosk-check-lede">Checks the things that decide whether the kiosk runs smoothly on this screen. It takes about a minute.</p>
  <ol class="kiosk-check-list" aria-live="polite"></ol>
  <div class="kiosk-check-touch">
    <button class="kiosk-button kiosk-check-tap" type="button">Tap here with a finger</button>
  </div>
  <div class="kiosk-check-preview"><video class="kiosk-check-video" muted playsinline preload="auto"></video></div>
  <section class="kiosk-qr-card kiosk-check-result" hidden>
    <div class="kiosk-qr kiosk-check-qr" role="img" aria-label="QR code with the device check results"></div>
    <div>
      <p class="kiosk-qr-title kiosk-check-verdict"></p>
      <p class="kiosk-qr-sub">Scan to copy these results to your phone</p>
      <p class="kiosk-link kiosk-check-summary"></p>
    </div>
  </section>
  <button class="kiosk-button kiosk-button-quiet kiosk-check-again" type="button" hidden>Run again</button>
</main>
</body>
</html>
